# GitHub Actions Workflow for CI/CD - Phase 1
# This workflow implements: compile, format check, and tests

# Workflow name (appears in GitHub Actions UI)
name: CI

# Trigger conditions: when does this workflow run?
on:
  push:
    branches: [ main ]  # Run on every push to main branch
  pull_request:
    branches: [ main ]  # Run on every PR targeting main branch

# Jobs: independent units of work that can run in parallel
jobs:
  # Job name: appears in GitHub Actions UI
  build-and-test:
    # Runner environment: the OS/platform this job runs on
    # ubuntu-latest = most recent Ubuntu LTS (currently 22.04)
    runs-on: ubuntu-latest

    # Steps: sequential tasks executed within this job
    steps:
      # Step 1: Checkout the repository code
      # Uses a pre-built GitHub Action from the marketplace
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Java (required for Scala/sbt)
      # temurin = Eclipse Temurin (formerly AdoptOpenJDK)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'  # Scala 3.2.1 works well with Java 11

      # Step 3: Install sbt (Scala Build Tool)
      # This ensures sbt is available regardless of runner environment
      # Official installation instructions from scala-sbt.org
      - name: Install sbt
        run: |
          echo "deb https://repo.scala-sbt.org/scalasbt/debian all main" | sudo tee /etc/apt/sources.list.d/sbt.list
          echo "deb https://repo.scala-sbt.org/scalasbt/debian /" | sudo tee /etc/apt/sources.list.d/sbt_old.list
          curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" | sudo apt-key add
          sudo apt-get update
          sudo apt-get install sbt

      # Step 4: Compile the project
      # The 'run' directive executes shell commands
      - name: Compile
        run: sbt compile

      # Step 5: Check code formatting
      # scalafmtCheck fails if code is not properly formatted
      # Note: requires .scalafmt.conf to exist in project root
      - name: Check formatting
        run: sbt scalafmtCheckAll

      # Step 6: Run tests
      # Executes all tests defined in the project
      - name: Run tests
        run: sbt test
